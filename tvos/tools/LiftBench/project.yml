# Lambent's Auto HDR on the Apple TV, timed on a device: the app's own processor (Playback/Lambent: the lift, Deepen blacks and the
# upscalers) fed by AVPlayer through an AVPlayerItemVideoOutput and shown in an AVSampleBufferDisplayLayer, as the player does it.
# `make_videos.sh` first (the clips are git-ignored), then `xcodegen`, build with xcodebuild and run with
# `xcrun devicectl device process launch --console`; it prints BENCH lines. The iOS target runs on an iPhone (an A-series GPU like the
# Apple TV's); the tvOS one on an Apple TV.
name: LiftBench
options:
  bundleIdPrefix: app.getlambent
targets:
  LiftBench-iOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
      - ../../Runner/Playback/Lambent/LambentLiftProcessor.swift
      - ../../Runner/Playback/Lambent/LambentPrescaler.swift
      - ../../Runner/Playback/Lambent/LambentNeuralScaler.swift
      - ../../Runner/Playback/Lambent/LambentTrueHDRTables.swift
      - path: ../../Runner/Shaders
        type: folder
        buildPhase: resources
      - path: Videos
        type: folder
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.getlambent.liftbench
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      DEVELOPMENT_TEAM: T6355X8JD5
      CODE_SIGN_STYLE: Automatic
      SWIFT_VERSION: "5.0"
  LiftBench-tvOS:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - Sources
      - ../../Runner/Playback/Lambent/LambentLiftProcessor.swift
      - ../../Runner/Playback/Lambent/LambentPrescaler.swift
      - ../../Runner/Playback/Lambent/LambentNeuralScaler.swift
      - ../../Runner/Playback/Lambent/LambentTrueHDRTables.swift
      - path: ../../Runner/Shaders
        type: folder
        buildPhase: resources
      - path: Videos
        type: folder
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.getlambent.liftbench
      GENERATE_INFOPLIST_FILE: YES
      DEVELOPMENT_TEAM: T6355X8JD5
      CODE_SIGN_STYLE: Automatic
      SWIFT_VERSION: "5.0"
