<?xml version="1.0" encoding="UTF-8"?>
<!-- Lambent mark: an amber orb with a soft glow. File name kept so existing asset references keep working. -->
<svg
  version="1.1"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
>
  <defs>
    <radialGradient id="lambentGlow" cx="512" cy="512" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0.60" style="stop-color:#FFA028;stop-opacity:0.60" />
      <stop offset="0.72" style="stop-color:#FFA028;stop-opacity:0.27" />
      <stop offset="0.86" style="stop-color:#FFA028;stop-opacity:0.06" />
      <stop offset="1" style="stop-color:#FFA028;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="lambentOrb" cx="512" cy="512" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:#FFD682" />
      <stop offset="1" style="stop-color:#FFA028" />
    </radialGradient>
  </defs>
  <circle cx="512" cy="512" r="500" fill="url(#lambentGlow)" />
  <circle cx="512" cy="512" r="300" fill="url(#lambentOrb)" />
</svg>
